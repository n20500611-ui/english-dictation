<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人教版英语五年级下册 - 听写练习</title>
    <meta name="description" content="人教版PEP英语五年级下册单词和句子听写练习应用">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="英语听写">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 20px 10px;
        }
        
        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            color: white;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.75em;
            opacity: 0.9;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .unit-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 15px;
            background: white;
        }
        
        .mode-select {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #667eea;
            color: white;
        }
        
        .dictation-area {
            text-align: center;
            padding: 30px 10px;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2.5em;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
        }
        
        .play-btn:active {
            transform: scale(0.95);
        }
        
        .play-btn.playing {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5); }
            50% { box-shadow: 0 5px 40px rgba(102, 126, 234, 0.8); }
        }
        
        .hint-text {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .answer-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .answer-input.correct {
            border-color: #4CAF50;
            background: #E8F5E9;
        }
        
        .answer-input.wrong {
            border-color: #f44336;
            background: #FFEBEE;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-skip {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-show {
            background: #FFF3E0;
            color: #FF9800;
        }
        
        .result-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .result-correct {
            background: #E8F5E9;
            color: #4CAF50;
        }
        
        .result-wrong {
            background: #FFEBEE;
            color: #f44336;
        }
        
        .correct-answer {
            background: #E3F2FD;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .correct-answer .word {
            font-size: 1.3em;
            font-weight: bold;
            color: #1976D2;
        }
        
        .correct-answer .chinese {
            color: #666;
            margin-top: 5px;
        }
        
        /* 错题本样式 */
        .wrong-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .wrong-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .wrong-item:last-child {
            border-bottom: none;
        }
        
        .wrong-item .word-info {
            flex: 1;
        }
        
        .wrong-item .word-text {
            font-weight: bold;
            color: #333;
        }
        
        .wrong-item .word-chinese {
            font-size: 0.85em;
            color: #666;
        }
        
        .wrong-item .wrong-count {
            background: #FFEBEE;
            color: #f44336;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            margin-right: 10px;
        }
        
        .wrong-item .remove-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 1.2em;
            cursor: pointer;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #FFEBEE;
            border: none;
            border-radius: 10px;
            color: #f44336;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        
        .settings-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        
        .setting-label {
            color: #333;
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .speed-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }
        
        .speed-value {
            width: 50px;
            text-align: center;
            font-weight: bold;
        }
        
        /* 隐藏类 */
        .hidden {
            display: none !important;
        }
        
        /* 响应式 */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.2em;
            }
            
            .stat-number {
                font-size: 1.4em;
            }
            
            .play-btn {
                width: 80px;
                height: 80px;
                font-size: 2em;
            }
        }
        
        /* 错题练习提示 */
        .wrong-mode-notice {
            background: #FFF3E0;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #FF9800;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 人教版英语五年级下册</h1>
            <p>听写练习 · 轻松掌握每一个单词</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="totalWords">0</div>
                <div class="stat-label">总词数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="masteredWords">0</div>
                <div class="stat-label">已掌握</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="wrongCount">0</div>
                <div class="stat-label">错题数</div>
            </div>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="dictation">📝 听写练习</button>
            <button class="tab-btn" data-tab="wrong-book">📖 错题本</button>
        </div>
        
        <!-- 听写练习页 -->
        <div id="dictation-tab" class="tab-content">
            <div class="card">
                <select class="unit-select" id="unitSelect">
                    <option value="all">全部单元</option>
                </select>
                
                <div class="mode-select">
                    <button class="mode-btn active" data-mode="word">单词听写</button>
                    <button class="mode-btn" data-mode="sentence">句子听写</button>
                    <button class="mode-btn" data-mode="wrong">错题复习</button>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">点击播放按钮开始听写</div>
                
                <div id="wrongModeNotice" class="wrong-mode-notice hidden">
                    ⚠️ 错题复习模式：只练习错题本中的单词，答对3次后自动移出
                </div>
                
                <div class="dictation-area">
                    <button class="play-btn" id="playBtn">🔊</button>
                    <p class="hint-text">点击播放听写内容</p>
                </div>
                
                <input type="text" class="answer-input" id="answerInput" placeholder="输入答案后按回车提交">
                
                <div id="resultArea"></div>
                
                <div class="action-buttons">
                    <button class="action-btn btn-skip" id="skipBtn">跳过</button>
                    <button class="action-btn btn-show" id="showBtn">显示答案</button>
                    <button class="action-btn btn-submit" id="submitBtn">提交</button>
                </div>
                
                <div class="settings-section">
                    <div class="setting-item">
                        <span class="setting-label">播放速度</span>
                        <div class="speed-control">
                            <button class="speed-btn" id="speedDown">-</button>
                            <span class="speed-value" id="speedValue">1.0x</span>
                            <button class="speed-btn" id="speedUp">+</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span class="setting-label">播放次数</span>
                        <div class="speed-control">
                            <button class="speed-btn" id="repeatDown">-</button>
                            <span class="speed-value" id="repeatValue">2次</span>
                            <button class="speed-btn" id="repeatUp">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 错题本页 -->
        <div id="wrong-book-tab" class="tab-content hidden">
            <div class="card">
                <h3 style="margin-bottom: 15px;">📖 错题本</h3>
                <div class="wrong-list" id="wrongList">
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <p>太棒了！暂无错题</p>
                    </div>
                </div>
                <button class="clear-btn" id="clearWrongBtn">清空错题本</button>
            </div>
        </div>
    </div>

    <script src="vocabulary.js"></script>
    <script>
        // 应用状态
        const state = {
            currentMode: 'word', // word, sentence, wrong
            currentUnit: 'all',
            currentIndex: 0,
            playSpeed: 1.0,
            repeatCount: 2,
            currentWord: null,
            wrongBook: {},
            masteredWords: new Set(),
            isPlaying: false
        };

        // DOM 元素
        const elements = {
            unitSelect: document.getElementById('unitSelect'),
            playBtn: document.getElementById('playBtn'),
            answerInput: document.getElementById('answerInput'),
            submitBtn: document.getElementById('submitBtn'),
            skipBtn: document.getElementById('skipBtn'),
            showBtn: document.getElementById('showBtn'),
            resultArea: document.getElementById('resultArea'),
            progressFill: document.getElementById('progressFill'),
            progressText: document.getElementById('progressText'),
            wrongModeNotice: document.getElementById('wrongModeNotice'),
            wrongList: document.getElementById('wrongList'),
            clearWrongBtn: document.getElementById('clearWrongBtn'),
            totalWords: document.getElementById('totalWords'),
            masteredWords: document.getElementById('masteredWords'),
            wrongCount: document.getElementById('wrongCount'),
            speedValue: document.getElementById('speedValue'),
            repeatValue: document.getElementById('repeatValue')
        };

        // 初始化
        function init() {
            loadFromStorage();
            populateUnitSelect();
            updateStats();
            renderWrongList();
            bindEvents();
            updateProgress();
        }

        // 从localStorage加载数据
        function loadFromStorage() {
            const savedWrongBook = localStorage.getItem('english_wrongBook');
            const savedMastered = localStorage.getItem('english_mastered');
            
            if (savedWrongBook) {
                state.wrongBook = JSON.parse(savedWrongBook);
            }
            if (savedMastered) {
                state.masteredWords = new Set(JSON.parse(savedMastered));
            }
        }

        // 保存到localStorage
        function saveToStorage() {
            localStorage.setItem('english_wrongBook', JSON.stringify(state.wrongBook));
            localStorage.setItem('english_mastered', JSON.stringify([...state.masteredWords]));
        }

        // 填充单元选择
        function populateUnitSelect() {
            const units = Object.keys(vocabulary);
            units.forEach((unit, index) => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                elements.unitSelect.appendChild(option);
            });
        }

        // 获取当前练习列表
        function getCurrentList() {
            if (state.currentMode === 'wrong') {
                // 错题模式：从错题本获取
                const wrongItems = [];
                for (const key in state.wrongBook) {
                    const item = state.wrongBook[key];
                    wrongItems.push({
                        word: item.word,
                        chinese: item.chinese,
                        key: key,
                        type: item.type || 'word'
                    });
                }
                return wrongItems;
            }
            
            const source = state.currentMode === 'word' ? vocabulary : sentences;
            let list = [];
            
            if (state.currentUnit === 'all') {
                for (const unit in source) {
                    source[unit].forEach((item, index) => {
                        const key = `${state.currentMode}-${unit}-${index}`;
                        // 如果不是错题模式，跳过已掌握的单词
                        if (!state.masteredWords.has(key)) {
                            list.push({ ...item, unit, key, type: state.currentMode });
                        }
                    });
                }
            } else {
                if (source[state.currentUnit]) {
                    source[state.currentUnit].forEach((item, index) => {
                        const key = `${state.currentMode}-${state.currentUnit}-${index}`;
                        if (!state.masteredWords.has(key)) {
                            list.push({ ...item, unit: state.currentUnit, key, type: state.currentMode });
                        }
                    });
                }
            }
            
            return list;
        }

        // 随机获取下一个
        function getNextWord() {
            const list = getCurrentList();
            if (list.length === 0) {
                return null;
            }
            const randomIndex = Math.floor(Math.random() * list.length);
            return list[randomIndex];
        }

        // 播放语音
        function playAudio(text, times = state.repeatCount) {
            if (state.isPlaying) return;
            state.isPlaying = true;
            elements.playBtn.classList.add('playing');
            
            let count = 0;
            
            function speak() {
                if (count >= times) {
                    state.isPlaying = false;
                    elements.playBtn.classList.remove('playing');
                    return;
                }
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = state.playSpeed;
                
                utterance.onend = () => {
                    count++;
                    setTimeout(() => {
                        if (count < times) {
                            speak();
                        } else {
                            state.isPlaying = false;
                            elements.playBtn.classList.remove('playing');
                        }
                    }, 500);
                };
                
                utterance.onerror = () => {
                    state.isPlaying = false;
                    elements.playBtn.classList.remove('playing');
                };
                
                speechSynthesis.speak(utterance);
            }
            
            speak();
        }

        // 检查答案
        function checkAnswer(userAnswer) {
            if (!state.currentWord) return;
            
            const correctAnswer = state.currentWord.word || state.currentWord.english;
            const key = state.currentWord.key;
            
            // 标准化比较（忽略大小写和多余空格）
            const normalizedUser = userAnswer.trim().toLowerCase();
            const normalizedCorrect = correctAnswer.trim().toLowerCase();
            
            const isCorrect = normalizedUser === normalizedCorrect;
            
            if (isCorrect) {
                // 答对
                showResult(true, correctAnswer, state.currentWord.chinese);
                elements.answerInput.classList.add('correct');
                
                // 从错题本移除或减少错误次数
                if (state.wrongBook[key]) {
                    state.wrongBook[key].correctCount = (state.wrongBook[key].correctCount || 0) + 1;
                    // 连续答对3次，从错题本移除
                    if (state.wrongBook[key].correctCount >= 3) {
                        delete state.wrongBook[key];
                        state.masteredWords.add(key);
                    }
                } else {
                    // 首次答对，加入已掌握
                    state.masteredWords.add(key);
                }
                
                saveToStorage();
                updateStats();
                renderWrongList();
                
                // 自动进入下一个
                setTimeout(() => {
                    nextWord();
                }, 1500);
            } else {
                // 答错
                showResult(false, correctAnswer, state.currentWord.chinese);
                elements.answerInput.classList.add('wrong');
                
                // 加入错题本
                if (!state.wrongBook[key]) {
                    state.wrongBook[key] = {
                        word: correctAnswer,
                        chinese: state.currentWord.chinese,
                        wrongCount: 0,
                        correctCount: 0,
                        type: state.currentMode,
                        addedAt: Date.now()
                    };
                }
                state.wrongBook[key].wrongCount++;
                state.wrongBook[key].lastWrongAt = Date.now();
                
                // 从已掌握移除
                state.masteredWords.delete(key);
                
                saveToStorage();
                updateStats();
                renderWrongList();
            }
        }

        // 显示结果
        function showResult(isCorrect, word, chinese) {
            let html = '';
            if (isCorrect) {
                html = `
                    <div class="result-message result-correct">
                        ✅ 正确！太棒了！
                    </div>
                `;
            } else {
                html = `
                    <div class="result-message result-wrong">
                        ❌ 错误，正确答案是：
                    </div>
                    <div class="correct-answer">
                        <div class="word">${word}</div>
                        <div class="chinese">${chinese}</div>
                    </div>
                `;
            }
            elements.resultArea.innerHTML = html;
        }

        // 下一个单词
        function nextWord() {
            state.currentWord = getNextWord();
            elements.answerInput.value = '';
            elements.answerInput.classList.remove('correct', 'wrong');
            elements.resultArea.innerHTML = '';
            
            if (!state.currentWord) {
                elements.progressText.textContent = '🎉 恭喜！全部完成！';
                elements.resultArea.innerHTML = `
                    <div class="result-message result-correct">
                        🎉 太棒了！你已经掌握了所有内容！
                    </div>
                `;
                return;
            }
            
            updateProgress();
            
            // 自动播放
            setTimeout(() => {
                const text = state.currentWord.word || state.currentWord.english;
                playAudio(text);
            }, 300);
        }

        // 更新进度
        function updateProgress() {
            const list = getCurrentList();
            const total = list.length;
            const mastered = state.masteredWords.size;
            
            // 计算进度百分比
            const allItems = [];
            const source = state.currentMode === 'word' ? vocabulary : sentences;
            if (state.currentUnit === 'all') {
                for (const unit in source) {
                    allItems.push(...source[unit]);
                }
            } else {
                allItems.push(...(source[state.currentUnit] || []));
            }
            
            const totalAll = allItems.length;
            const percent = totalAll > 0 ? Math.round((totalAll - total) / totalAll * 100) : 0;
            
            elements.progressFill.style.width = `${percent}%`;
            elements.progressText.textContent = `剩余 ${total} 个待练习`;
        }

        // 更新统计
        function updateStats() {
            // 计算总词数
            let total = 0;
            for (const unit in vocabulary) {
                total += vocabulary[unit].length;
            }
            for (const unit in sentences) {
                total += sentences[unit].length;
            }
            
            elements.totalWords.textContent = total;
            elements.masteredWords.textContent = state.masteredWords.size;
            elements.wrongCount.textContent = Object.keys(state.wrongBook).length;
        }

        // 渲染错题列表
        function renderWrongList() {
            const wrongKeys = Object.keys(state.wrongBook);
            
            if (wrongKeys.length === 0) {
                elements.wrongList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <p>太棒了！暂无错题</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            wrongKeys.forEach(key => {
                const item = state.wrongBook[key];
                html += `
                    <div class="wrong-item">
                        <div class="word-info">
                            <div class="word-text">${item.word}</div>
                            <div class="word-chinese">${item.chinese}</div>
                        </div>
                        <span class="wrong-count">错${item.wrongCount}次</span>
                        <button class="remove-btn" data-key="${key}">✕</button>
                    </div>
                `;
            });
            
            elements.wrongList.innerHTML = html;
            
            // 绑定移除事件
            elements.wrongList.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.dataset.key;
                    delete state.wrongBook[key];
                    state.masteredWords.add(key);
                    saveToStorage();
                    updateStats();
                    renderWrongList();
                });
            });
        }

        // 绑定事件
        function bindEvents() {
            // Tab切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    const tab = e.target.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById(`${tab}-tab`).classList.remove('hidden');
                });
            });
            
            // 单元选择
            elements.unitSelect.addEventListener('change', (e) => {
                state.currentUnit = e.target.value;
                state.currentWord = null;
                updateProgress();
            });
            
            // 模式选择
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.currentMode = e.target.dataset.mode;
                    
                    // 显示/隐藏错题模式提示
                    if (state.currentMode === 'wrong') {
                        elements.wrongModeNotice.classList.remove('hidden');
                        elements.unitSelect.disabled = true;
                    } else {
                        elements.wrongModeNotice.classList.add('hidden');
                        elements.unitSelect.disabled = false;
                    }
                    
                    state.currentWord = null;
                    updateProgress();
                });
            });
            
            // 播放按钮
            elements.playBtn.addEventListener('click', () => {
                if (!state.currentWord) {
                    nextWord();
                } else {
                    const text = state.currentWord.word || state.currentWord.english;
                    playAudio(text);
                }
            });
            
            // 提交按钮
            elements.submitBtn.addEventListener('click', () => {
                const answer = elements.answerInput.value.trim();
                if (answer) {
                    checkAnswer(answer);
                }
            });
            
            // 回车提交
            elements.answerInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const answer = elements.answerInput.value.trim();
                    if (answer) {
                        checkAnswer(answer);
                    }
                }
            });
            
            // 跳过
            elements.skipBtn.addEventListener('click', () => {
                nextWord();
            });
            
            // 显示答案
            elements.showBtn.addEventListener('click', () => {
                if (state.currentWord) {
                    const word = state.currentWord.word || state.currentWord.english;
                    showResult(false, word, state.currentWord.chinese);
                    elements.answerInput.value = word;
                }
            });
            
            // 速度控制
            document.getElementById('speedDown').addEventListener('click', () => {
                if (state.playSpeed > 0.5) {
                    state.playSpeed = Math.round((state.playSpeed - 0.1) * 10) / 10;
                    elements.speedValue.textContent = `${state.playSpeed}x`;
                }
            });
            
            document.getElementById('speedUp').addEventListener('click', () => {
                if (state.playSpeed < 2.0) {
                    state.playSpeed = Math.round((state.playSpeed + 0.1) * 10) / 10;
                    elements.speedValue.textContent = `${state.playSpeed}x`;
                }
            });
            
            // 重复次数控制
            document.getElementById('repeatDown').addEventListener('click', () => {
                if (state.repeatCount > 1) {
                    state.repeatCount--;
                    elements.repeatValue.textContent = `${state.repeatCount}次`;
                }
            });
            
            document.getElementById('repeatUp').addEventListener('click', () => {
                if (state.repeatCount < 5) {
                    state.repeatCount++;
                    elements.repeatValue.textContent = `${state.repeatCount}次`;
                }
            });
            
            // 清空错题本
            elements.clearWrongBtn.addEventListener('click', () => {
                if (confirm('确定要清空错题本吗？')) {
                    state.wrongBook = {};
                    saveToStorage();
                    updateStats();
                    renderWrongList();
                }
            });
        }

        // 启动应用
        init();
    </script>
</body>
</html>
